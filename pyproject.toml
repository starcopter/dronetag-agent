[project]
name = "dronetag-app"
version = "0.12.0-a1"
description = "Auterion App to couple a Dronetag DRI module with Skynode."
readme = "README.md"
authors = [
    { name = "Lasse Fröhner", email = "lasse@starcopter.com" }
]
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "auterion-cli>=1.12.0",
    "ruff>=0.8.3",
    "mkdocs-material>=9.6.3",
    "setuptools>=75.8.0",
]

[tool.uv.sources]
dronetag-agent = { path = "services/agent" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
