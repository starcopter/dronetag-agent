{% extends "base.html" %}

{% block content %}
<h1>{{ title }}</h1>

{% for key, value in metadata.items() %}
<div class="row mt-3">
  <div class="col-6">{{ key }}</div>
  <div class="col-6">{{ value }}</div>
</div>
{% endfor %}

<div class="row mt-3">
  <div class="col-6">
      <label for="oprn" class="form-label">Operator Registration Number</label>
  </div>
  <div class="col-6">
      <input type="text" id="oprn" class="form-control" placeholder="e.g. FIN87astrdge12k8-xyz" />
  </div>
</div>
{% endblock content %}
