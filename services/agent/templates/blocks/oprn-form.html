{% set oprn_valid = oprn and not oprn_error %}
<form class="form-inline" novalidate autocomplete="off" {% if oprn_valid %}hx-delete="{{ url_for('delete_oprn') }}"
  {% else %}hx-post="{{ url_for('post_oprn') }}" {% endif %} hx-swap="outerHTML">

  <div class="row">
    <div class="col-12 col-md-5 my-1">
      <label for="oprn-input" class="form-label">Operator Registration Number</label>
    </div>
    <div class="col-12 col-md-7">
      <div class=" input-group has-validation">
        <input type="text" id="oprn-input" name="oprn" placeholder="e.g. FIN87astrdge12k8-xyz" required
          {% if oprn %}value="{{ oprn }}" {% endif %} {% if oprn_valid %}readonly disabled{% endif %}
          {% if oprn_error %}class="form-control is-invalid" {% elif oprn_valid %}class="form-control is-valid"
          {% else %}class="form-control" {% endif %} />
        {% if oprn_valid %}
        <button type="submit" class="btn btn-danger">Reset</button>
        {% else %}
        <button type="submit" class="btn btn-primary">Upload</button>
        {% endif %}
        {% if oprn_error %}<div class="invalid-feedback">{{ oprn_error }}</div>{% endif %}
        {% if oprn_success %}<div class="valid-feedback">{{ oprn_success }}</div>{% endif %}
        {% if message %}<div class="form-text container-fluid">{{ message }}</div>{% endif %}
      </div>
    </div>
  </div>
</form>
