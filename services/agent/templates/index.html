{% extends "base.html" %}

{% block content %}
<div class="row shadow-lg p-5">
  <h1>{{ title }}</h1>

  <div class="row mt-3">
    <div class="col-5">HIGHDRA</div>
    <div class="col-7" id="highdra-serial-number">{{ highdra_serial_number | default("Not set") }}</div>
  </div>
  {% if skynode_serial_number %}
  <div class="row mt-3">
    <div class="col-5">Skynode</div>
    <div class="col-7" id="skynode-serial-number">{{ skynode_serial_number }}</div>
  </div>
  {% endif %}

  <div class="row mt-3">
    {% include "blocks/oprn-form.html" %}
  </div>
</div>
{% endblock content %}
