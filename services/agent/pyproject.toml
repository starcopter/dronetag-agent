[project]
name = "dronetag-agent"
version = "0.12.0"
description = "MAVLink relay to couple a Dronetag DRI module with Skynode."
authors = [
    { name = "Lasse Fröhner", email = "lasse@starcopter.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.6",
    "jinja2-fragments>=1.7.0",
    "libmav==0.0.6",
    "pydantic-settings>=2.7.1",
    "python-multipart>=0.0.19",
]

[dependency-groups]
dev = [
    "ruff>=0.8.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
