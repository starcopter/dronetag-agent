auterion-api-version: 2
auterion-app-base: v2

app-name: dronetag-agent
app-version: 0.7.1  # auto-generated, do not edit
app-author: com.starcopter
target-platform:
  - skynode

services:
  agent: 
    build: services/agent

    http:
      /:
        proxy:
          port: 8000
        function: 
          type: ui
          label: Dronetag Agent

compose-override:
  services:
    agent:
      volumes:
        - /etc/hostname:/etc/skynode:ro
        - /persistent/suite/vehicle_sn:/etc/vehicle_sn:ro
