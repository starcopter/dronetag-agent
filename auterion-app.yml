auterion-api-version: 2
auterion-app-base: v2

app-name: dronetag-agent
app-version: 0.5.0-dev.3
app-author: com.starcopter
target-platform:
  - skynode

services:
  log-mavlink: 
    build: services/mavlink

  dronetag: 
    build: services/dronetag

    http:
      /:
        proxy:
          port: 8000
        function: 
          type: ui
          label: Dronetag Agent

compose-override:
  services:
    log-mavlink:
      volumes:
        - /etc/hostname:/etc/skynode:ro
    dronetag:
      volumes:
        - /etc/hostname:/etc/skynode:ro
