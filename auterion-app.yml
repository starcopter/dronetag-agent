auterion-api-version: 2
auterion-app-base: v2

app-name: dronetag-agent
app-version: 0.2.0
app-author: com.starcopter
target-platform:
  - skynode

services:
  log-mavlink: 
    build: services/mavlink

compose-override:
  services:
    log-mavlink:
      volumes:
        - /etc/hostname:/etc/skynode:ro
