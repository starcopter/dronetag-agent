auterion-api-version: 2
auterion-app-base: v2

app-name: dronetag-agent
app-version: 0.6.0
app-author: com.starcopter
target-platform:
  - skynode

services:
  dronetag: 
    build: src

    http:
      /:
        proxy:
          port: 8000
        function: 
          type: ui
          label: Dronetag Agent

compose-override:
  services:
    dronetag:
      volumes:
        - /etc/hostname:/etc/skynode:ro
